<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AgriBot — Agricultural Advisory Chatbot</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:  #1b5e20;
      --green:       #2e7d32;
      --green-mid:   #388e3c;
      --green-light: #c8e6c9;
      --green-pale:  #e8f5e9;
      --accent:      #ff8f00;
      --white:       #ffffff;
      --grey-light:  #f5f5f5;
      --grey:        #9e9e9e;
      --text:        #212121;
      --shadow:      0 2px 12px rgba(0,0,0,0.12);
      --radius:      14px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1b5e20 0%, #33691e 50%, #1b5e20 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* ── App Shell ────────────────────────────────────────── */
    .app {
      width: 100%;
      max-width: 820px;
      height: 92vh;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.35);
      background: var(--white);
    }

    /* ── Header ───────────────────────────────────────────── */
    .header {
      background: linear-gradient(90deg, var(--green-dark), var(--green-mid));
      color: var(--white);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .header-icon {
      width: 46px; height: 46px;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }
    .header-info h1 { font-size: 1.15rem; font-weight: 700; }
    .header-info p  { font-size: 0.78rem; opacity: 0.85; }
    .status-dot {
      margin-left: auto;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #69f0ae;
      box-shadow: 0 0 0 3px rgba(105,240,174,0.3);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 3px rgba(105,240,174,0.3); }
      50%      { box-shadow: 0 0 0 7px rgba(105,240,174,0.0); }
    }

    /* ── Quick Actions ────────────────────────────────────── */
    .quick-actions {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: var(--green-pale);
      overflow-x: auto;
      flex-shrink: 0;
      border-bottom: 1px solid var(--green-light);
      scrollbar-width: none;
    }
    .quick-actions::-webkit-scrollbar { display: none; }
    .qa-btn {
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--green-mid);
      background: var(--white);
      color: var(--green-dark);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    .qa-btn:hover {
      background: var(--green-mid);
      color: var(--white);
    }

    /* ── Chat Area ────────────────────────────────────────── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--grey-light);
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 5px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--green-light); border-radius: 4px; }

    /* ── Messages ─────────────────────────────────────────── */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      animation: slideIn 0.22s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user  { flex-direction: row-reverse; }
    .msg-row.bot   { flex-direction: row; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .avatar.bot  { background: var(--green-mid); color: white; }
    .avatar.user { background: var(--accent); color: white; }

    .bubble {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.88rem;
      color: var(--text);
    }
    .bubble.bot {
      background: var(--white);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow);
    }
    .bubble.user {
      background: var(--green-mid);
      color: var(--white);
      border-bottom-right-radius: 4px;
    }

    .bubble p     { margin-bottom: 6px; }
    .bubble strong{ font-weight: 700; }
    .bubble em    { font-style: italic; opacity: 0.85; }

    /* Intent tag */
    .intent-tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .intent-tag.crop_recommendation { background:#c8e6c9; color:#1b5e20; }
    .intent-tag.fertilizer_advice   { background:#fff3e0; color:#e65100; }
    .intent-tag.crop_disease        { background:#fce4ec; color:#880e4f; }
    .intent-tag.weather_planting    { background:#e3f2fd; color:#0d47a1; }

    /* ── Typing indicator ─────────────────────────────────── */
    .typing { display: flex; gap: 5px; align-items: center; padding: 8px 4px; }
    .typing span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green-mid);
      animation: bounce 1s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.30s; }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      40%      { transform: translateY(-6px); }
    }

    /* ── Input Bar ────────────────────────────────────────── */
    .input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--white);
      border-top: 1px solid var(--green-light);
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--green-light);
      border-radius: 24px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      color: var(--text);
      background: var(--grey-light);
    }
    #user-input:focus { border-color: var(--green-mid); background: var(--white); }
    #user-input::placeholder { color: var(--grey); }

    .send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--green-mid);
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover  { background: var(--green-dark); transform: scale(1.06); }
    .send-btn:active { transform: scale(0.96); }
    .send-btn:disabled { background: var(--grey); cursor: not-allowed; transform: none; }

    /* ── Footer ───────────────────────────────────────────── */
    .footer {
      text-align: center;
      font-size: 0.68rem;
      color: var(--grey);
      padding: 5px 0 8px;
      background: var(--white);
      flex-shrink: 0;
    }

    /* ── Responsive ───────────────────────────────────────── */
    @media (max-width: 520px) {
      .bubble { max-width: 88%; font-size: 0.84rem; }
      .header-info h1 { font-size: 1rem; }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-icon">🌱</div>
    <div class="header-info">
      <h1>AgriBot</h1>
      <p>English-Language Agricultural Advisory Chatbot</p>
    </div>
    <div class="status-dot" title="Online"></div>
  </div>

  <!-- Quick action buttons -->
  <div class="quick-actions">
    <button class="qa-btn" onclick="quickSend('Recommend a crop: N=90, P=42, K=43, temp=25, humidity=80, pH=6.5, rainfall=200')">🌾 Crop Advice</button>
    <button class="qa-btn" onclick="quickSend('Which fertilizer for wheat on sandy soil, N=10, K=5, P=15, temp=32, humidity=50, moisture=40?')">🧪 Fertilizer</button>
    <button class="qa-btn" onclick="quickSend('My rice leaves are turning yellow with brown spots. What disease is this?')">🌿 Disease Help</button>
    <button class="qa-btn" onclick="quickSend('Is it good to plant maize at temperature 30°C, humidity 75%, rainfall 150mm?')">🌦️ Weather</button>
    <button class="qa-btn" onclick="quickSend('help')">❓ Help</button>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chat-area"></div>

  <!-- Input -->
  <div class="input-bar">
    <input
      id="user-input"
      type="text"
      placeholder="Ask about crops, fertilizers, diseases, or weather..."
      autocomplete="off"
    />
    <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">
      ➤
    </button>
  </div>

  <div class="footer">AgriBot v1.0 &nbsp;|&nbsp; NLP Course Project &nbsp;|&nbsp; Powered by BERT + FastAPI</div>
</div>

<script>
  const API_BASE = "https://justly-dispersal-macaw.ngrok-free.dev";  // ← Change to your server URL when deploying
  const chatArea = document.getElementById("chat-area");
  const input    = document.getElementById("user-input");
  const sendBtn  = document.getElementById("send-btn");

  // ── Render helpers ───────────────────────────────────────────
  function renderMarkdown(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.+?)\*/g,     "<em>$1</em>")
      .replace(/\n/g,            "<br/>")
      .replace(/✅|⚠️|🌾|🧪|🌿|🌦️|📊|💡|🌱|🌧️|☀️|👋/g, m => `<span>${m}</span>`);
  }

  function appendMessage(role, text, intent = null, confidence = null) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;

    const avatar = document.createElement("div");
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === "bot" ? "🌱" : "👤";

    const bubble = document.createElement("div");
    bubble.className = `bubble ${role}`;

    if (role === "bot" && intent) {
      const tag = document.createElement("div");
      tag.className = `intent-tag ${intent}`;
      tag.textContent = intent.replace(/_/g, " ").toUpperCase();
      bubble.appendChild(tag);
    }

    const content = document.createElement("div");
    content.innerHTML = renderMarkdown(text);
    bubble.appendChild(content);

    if (role === "bot" && confidence !== null) {
      const conf = document.createElement("div");
      conf.style.cssText = "font-size:0.68rem;color:#9e9e9e;margin-top:5px;";
      conf.textContent = `Confidence: ${(confidence * 100).toFixed(1)}%`;
      bubble.appendChild(conf);
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
    return row;
  }

  function showTyping() {
    const row = document.createElement("div");
    row.className = "msg-row bot";
    row.id = "typing-indicator";

    const avatar = document.createElement("div");
    avatar.className = "avatar bot";
    avatar.textContent = "🌱";

    const bubble = document.createElement("div");
    bubble.className = "bubble bot";
    bubble.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  // ── Send message ─────────────────────────────────────────────
  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    appendMessage("user", text);
    input.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res  = await fetch(`${API_BASE}/chat`, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ message: text }),
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json();
        appendMessage("bot", `⚠️ Server error: ${err.detail || res.statusText}`);
        return;
      }

      const data = await res.json();
      appendMessage("bot", data.response, data.intent, data.confidence);

    } catch (err) {
      removeTyping();
      appendMessage("bot",
        "⚠️ Could not reach the AgriBot server.\n\n" +
        "Please make sure the FastAPI backend is running:\n" +
        "`uvicorn api.main:app --reload --port 8000`"
      );
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function quickSend(text) {
    input.value = text;
    sendMessage();
  }

  // Enter key
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Welcome message ──────────────────────────────────────────
  window.addEventListener("load", () => {
    appendMessage("bot",
      "👋 **Welcome to AgriBot!**\n\n" +
      "I'm your AI-powered agricultural advisor. I can help you with:\n" +
      "🌾 Crop recommendations based on soil data\n" +
      "🧪 Fertilizer dosing advice\n" +
      "🌿 Crop disease diagnosis\n" +
      "🌦️ Weather-based planting guidance\n\n" +
      "Try the quick-action buttons above, or type your question below!"
    );
  });
</script>
</body>
</html>
